<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080d18"><title>LevelUp Hunter</title>
<style>
:root{--bg:#080d18;--panel:#111a2b;--line:#263753;--blue:#72b7ff;--cyan:#6cf0e2;--text:#eef5ff;--muted:#9aaec8;--gold:#ffd47a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#17294a,#080d18 58%);color:var(--text);font:15px/1.45 system-ui,sans-serif;min-height:100vh}.app{max-width:540px;margin:auto;padding:20px 16px 90px}.top{display:flex;justify-content:space-between;margin-bottom:18px}.brand{font-size:12px;letter-spacing:.18em;color:var(--blue);font-weight:800}.date,.sub,.stat .l,.qdesc,.notice{color:var(--muted)}.date{font-size:12px}.hero{border:1px solid #2b4770;border-radius:22px;padding:20px;background:linear-gradient(140deg,#1b3154,#101a2c 70%);box-shadow:0 12px 36px #0005}.rankrow{display:flex;align-items:center;gap:14px}.emblem{width:58px;height:58px;border-radius:17px;display:grid;place-items:center;font-size:27px;background:linear-gradient(145deg,#6dbdff,#254e92)}.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--cyan);font-weight:800}.hunter{font-size:24px;font-weight:850;margin:3px 0}.sub{font-size:13px}.xprow{display:flex;justify-content:space-between;margin:20px 0 8px;font-size:12px;color:#c4d5ee}.track{height:9px;background:#091323;border-radius:20px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));transition:width .4s}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0 22px}.stat{background:#101a2b;border:1px solid var(--line);border-radius:15px;padding:12px 10px}.stat .n{font-size:21px;font-weight:800}.stat .l{font-size:11px}.sectionhead{display:flex;justify-content:space-between;align-items:end;margin:20px 0 11px}.sectionhead h2{font-size:18px;margin:0}.sectionhead span{font-size:12px;color:var(--muted)}.tabs{display:flex;gap:8px;margin-bottom:12px}.tab{flex:1;border:1px solid var(--line);background:#101a2b;color:var(--muted);padding:11px 8px;border-radius:12px;font-weight:750}.tab.active{background:#18345a;border-color:#4c8bd2;color:#e9f5ff}.questlist{display:grid;gap:10px}.quest{display:flex;gap:11px;align-items:center;background:linear-gradient(120deg,#121e31,#0e1727);border:1px solid var(--line);padding:13px;border-radius:16px}.quest.done{border-color:#2c8c7c;background:linear-gradient(120deg,#10302e,#101d2c)}.qicon{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:21px;background:#1b2b43;flex-shrink:0}.qmain{flex:1;min-width:0}.qtitle{font-weight:750}.qdesc{font-size:12px;margin-top:3px}.xp{font-size:12px;color:var(--gold);font-weight:800;margin-top:5px}.complete{border:1px solid #3a5779;color:#dbeaff;background:#1a2b43;border-radius:11px;padding:9px 10px;font-weight:800;min-width:68px}.done .complete{background:#174b42;border-color:#368d7d;color:#9ff4d9}.notice{text-align:center;font-size:12px;margin-top:17px}.bottom{position:fixed;bottom:0;left:0;right:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:#080d18ee;border-top:1px solid #24344c;display:flex;justify-content:center}.bottominner{max-width:540px;width:100%;display:flex;gap:10px}.action{flex:1;padding:12px;border-radius:13px;border:1px solid var(--line);font-weight:750;background:#121e31;color:var(--text)}.primary{background:#1c4776!important;border-color:#4388ce!important}.toast{position:fixed;top:12px;left:50%;transform:translate(-50%,-150%);background:#174b42;border:1px solid #368d7d;padding:11px 16px;border-radius:14px;transition:transform .25s;z-index:4;white-space:nowrap}.toast.show{transform:translate(-50%,0)}button{cursor:pointer}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div class="toast" id="toast" role="status">Quest complete!</div><main class="app">
<header class="top"><div class="brand">◈ LEVELUP HUNTER</div><div class="date" id="date"></div></header>
<section class="hero"><div class="rankrow"><div class="emblem">⚔</div><div><div class="eyebrow">HUNTER STATUS</div><div class="hunter" id="rank">Rookie Hunter</div><div class="sub" id="rankline">Your journey starts today.</div></div></div><div class="xprow"><span id="level">LEVEL 1</span><span id="xptext">0 / 100 XP</span></div><div class="track"><div class="fill" id="fill" style="width:0%"></div></div></section>
<section class="stats"><div class="stat"><div class="n" id="total">0</div><div class="l">TOTAL XP</div></div><div class="stat"><div class="n" id="donecount">0/6</div><div class="l">QUESTS DONE</div></div><div class="stat"><div class="n" id="streak">0 🔥</div><div class="l">DAY STREAK</div></div></section>
<div class="sectionhead"><h2>Today's quests</h2><span id="remaining">6 remaining</span></div><div class="tabs"><button class="tab active" data-tab="all">All quests</button><button class="tab" data-tab="body">💪 Body</button><button class="tab" data-tab="mind">🧠 Mind</button></div><section class="questlist" id="list"></section><p class="notice">Small steps. Daily progress. Become stronger at your own pace.</p></main>
<nav class="bottom"><div class="bottominner"><button class="action" id="reset">Reset demo</button><button class="action primary" id="review">Review progress</button></div></nav>
<script>
const qs=[{id:'walk',cat:'body',icon:'🚶',title:'Move your body',desc:'Take a comfortable 10-minute walk.',xp:20},{id:'strength',cat:'body',icon:'💪',title:'Strength practice',desc:'Try a gentle beginner bodyweight session.',xp:25},{id:'water',cat:'body',icon:'💧',title:'Hydration check',desc:'Drink water and notice how you feel.',xp:10},{id:'learn',cat:'mind',icon:'📘',title:'Learn something',desc:'Read or study with focus for 10 minutes.',xp:20},{id:'calm',cat:'mind',icon:'🌿',title:'Calm your mind',desc:'Take 2 minutes for comfortable breathing.',xp:15},{id:'reflect',cat:'mind',icon:'✍️',title:'Daily reflection',desc:'Write one win and one thing to improve.',xp:10}];
const key='levelup-hunter-demo-v1',today=()=>new Date().toISOString().slice(0,10);let s;try{s=JSON.parse(localStorage.getItem(key))}catch(e){}if(!s)s={xp:0,completed:[],day:today(),streak:0,lastDoneDay:null};if(s.day!==today()){s.day=today();s.completed=[]}let tab='all';const $=x=>document.getElementById(x),lvl=()=>Math.floor(s.xp/100)+1;
function save(){try{localStorage.setItem(key,JSON.stringify(s))}catch(e){}}
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1600)}
function render(){$('date').textContent=new Date().toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});$('total').textContent=s.xp;$('donecount').textContent=s.completed.length+'/6';$('remaining').textContent=(6-s.completed.length)+' remaining';$('streak').textContent=s.streak+' 🔥';$('level').textContent='LEVEL '+lvl();$('xptext').textContent=(s.xp%100)+' / 100 XP';$('fill').style.width=(s.xp%100)+'%';$('rank').textContent=lvl()>=10?'Shadow Monarch':lvl()>=7?'S-Rank Hunter':lvl()>=5?'A-Rank Hunter':lvl()>=3?'B-Rank Hunter':'Rookie Hunter';$('rankline').textContent=lvl()===1?'Your journey starts today.':'Keep going. Your effort is adding up.';$('list').innerHTML='';qs.filter(q=>tab==='all'||q.cat===tab).forEach(q=>{let d=s.completed.includes(q.id),e=document.createElement('article');e.className='quest'+(d?' done':'');e.innerHTML=`<div class="qicon">${q.icon}</div><div class="qmain"><div class="qtitle">${q.title}</div><div class="qdesc">${q.desc}</div><div class="xp">+${q.xp} XP</div></div><button class="complete">${d?'✓ Done':'Complete'}</button>`;e.querySelector('button').onclick=()=>toggle(q);$('list').appendChild(e)});document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('review').textContent=s.completed.length===6?'All quests cleared!':'Review progress'}
function toggle(q){let i=s.completed.indexOf(q.id);if(i>=0){s.completed.splice(i,1);s.xp=Math.max(0,s.xp-q.xp);toast('Quest unchecked')}else{let old=lvl();s.completed.push(q.id);s.xp+=q.xp;toast(lvl()>old?'LEVEL UP! Level '+lvl():'Quest complete! +'+q.xp+' XP');if(s.completed.length===6&&s.lastDoneDay!==today()){s.streak=s.lastDoneDay===new Date(Date.now()-86400000).toISOString().slice(0,10)?s.streak+1:Math.max(1,s.streak);s.lastDoneDay=today()}}save();render()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});$('reset').onclick=()=>{if(confirm('Reset demo progress on this device?')){s={xp:0,completed:[],day:today(),streak:0,lastDoneDay:null};save();render();toast('Progress reset')}};$('review').onclick=()=>toast(s.completed.length+' of 6 quests completed');render();
</script></body></html>
